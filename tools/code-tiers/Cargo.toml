[package]
name = "code-tiers"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Prototype tooling for Tock's Code Tiers annotation system (kernel-crate pilot)."
publish = false

[[bin]]
name = "code-tiers"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
clap = { version = "4.0.29", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
